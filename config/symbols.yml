# Written by scripts/gen.py --extract. The source of record for the
# scatter script's layout, for each function's address and instruction
# set, and for each data symbol's address and size. Regenerate the
# scatter and include/generated/ with: python scripts/gen.py
#
# layout    - regions in link order; 'sel' is armlink's section
#             selector, kept verbatim so the generator only formats.
# functions - one per asm function, sorted by address. 'addr' is from
#             the link, 'isa' from the declaring macro.
# globals   - one per GLOBAL in data/, sorted by address. No size:
#             armasm emits none for a data label.
# pools     - one per asm unit with a literal pool: its entries'
#             addresses in order, from the _0XXXXXXX labels the asm
#             gives them. scripts/asmfix/pools.py names a compiled
#             unit's entries from this list so objdiff pairs them.
#
# 'decl' is the one hand-written field: the C declaration of that
# symbol, minus 'extern' and the semicolon. --extract carries it
# across by (addr, name); everything else it overwrites. Symbols with
# a decl are what include/generated/*.h declares.
