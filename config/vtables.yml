# Vtable classes: what tcpp emits for a ported class versus what the original
# object had. Read by scripts/asmfix/vtables.py.
#
# area   - the AREA name the original asm gave the class vtable. tcpp names it
#          __VTABLE__<len><class>; the original used a three-digit id, and armlink
#          sorts AREAs by name, so the id decides where the vtable lands.
# slots  - the symbol each vtable slot resolves to, in slot order, offset 4*i.
#          tcpp emits m<offset>__<len><class>F<args> for a slot body written as a
#          member, and __dt__... for slot 0; these are renamed to the original
#          symbol so the linker finds the asm (or the C) that already holds it.
#          null is a pure virtual slot (tcpp emits __pvfn__Fv itself).
#          A class with no slots listed only gets its AREA renamed.
#
# arg_encodings - the tcpp argument encodings seen so far on a slot body: v (none),
#          Pv (void *), i (int). Return type never appears. Extend when a new shape
#          shows up (winx-78k.19, winx-78k.26).
arg_encodings: [v, Pv, i]
